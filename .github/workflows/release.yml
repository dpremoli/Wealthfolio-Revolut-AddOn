name: Release Addon

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: addon
        run: npm install

      - name: Run tests
        working-directory: addon
        run: npm run test

      - name: Type check
        working-directory: addon
        run: npm run type-check

      - name: Build addon
        working-directory: addon
        run: npm run build

      - name: Create ZIP
        working-directory: addon
        run: zip -j revolut-addon.zip manifest.json dist/addon.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Revolut Addon ${{ github.event.inputs.version || github.ref_name }}
          files: addon/revolut-addon.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
